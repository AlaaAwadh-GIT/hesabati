<!DOCTYPE html>
<html lang="ar" dir="rtl" data-app="expenses"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مصاريفي الشهرية</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="../icons/expenses-192.png"><script src="../lib/zip.js"></script><script src="../lib/sync.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet"><style id="st">
/* VOICE: calm money tool, clear and exact, like a household ledger.
   IDEA: a Swiss timetable for the month: one big number, strict rows.
   PICTURE: the month's total in huge numerals, with the tool beneath it.
   COLOUR and TYPE: white, black, signal red for the top category; IBM Plex Sans Arabic.
   LAYOUT: thick top rule, total band, then form + breakdown, entries, month history. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e0e0e);--ink:light-dark(#111,#f2f2f2);--mut:light-dark(#6b6b6b,#9a9a9a);--line:light-dark(#e3e3e3,#262626);--soft:light-dark(#f4f4f4,#181818);--red:#e4002b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow-x:clip;border-top:10px solid var(--ink)}
.band{padding:clamp(22px,4vw,48px) max(5vw,16px)}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:17px;margin:0;font-weight:700}
h2{font-size:20px;margin:0 0 14px;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:6px}
.nav button{width:44px;height:44px;border:1.5px solid var(--ink);background:none;color:var(--ink);font-size:20px;cursor:pointer;border-radius:0}
.nav strong{min-width:9em;text-align:center;font-size:18px}
.total{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:22px;border-bottom:3px solid var(--ink);padding-bottom:18px}
.big{font-size:clamp(56px,13vw,128px);font-weight:700;line-height:.95;letter-spacing:-2px;font-variant-numeric:tabular-nums;direction:ltr}
.cur{font-size:22px;font-weight:700;padding-bottom:10px}
.meta{color:var(--mut);margin-top:10px;display:flex;gap:18px;flex-wrap:wrap}
.meta b{color:var(--ink)}.up{color:var(--red)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px)}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 6px}
input{width:100%;height:48px;font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1.5px solid transparent;padding:0 12px;border-radius:0}
input:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.amt{font-size:26px;font-weight:700;height:60px;direction:ltr;text-align:right}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 14px;border:1.5px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.go{margin-top:16px;width:100%;height:54px;border:0;background:var(--red);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer}
.ghost{background:none;border:1.5px solid var(--ink);color:var(--ink);font:inherit;min-height:44px;padding:0 14px;cursor:pointer}
.cancel{margin-top:8px;width:100%}
.bars{display:grid;gap:12px}
.bar .lab{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.bar .lab span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.bar .tr{height:12px;background:var(--soft);margin-top:4px}
.bar .fl{height:100%;background:var(--ink)}.bar.top .fl{background:var(--red)}
.list{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.list li{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.day{font-size:26px;font-weight:700;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.day small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
.what b{display:block}.what span{color:var(--mut);font-size:14px}
.amtc{text-align:left;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:2px;justify-content:flex-end}
.acts button{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;min-height:36px;padding:0 6px;cursor:pointer}
.acts button:hover{color:var(--red)}
.empty{color:var(--mut);padding:18px 0}
table{width:100%;border-collapse:collapse;border-top:2px solid var(--ink)}
th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:right}
th{font-size:14px;color:var(--mut);font-weight:500}
td.n,th.n{text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.usdc{color:var(--mut)}tbody tr{cursor:pointer}tbody tr:hover{background:var(--soft)}tr.on td{font-weight:700}tr.on td:first-child{box-shadow:inset -4px 0 var(--red)}
.down{color:light-dark(#0a7a3b,#4cc77f)}
.sum{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px;color:var(--mut)}.sum b{color:var(--ink)}
details{margin-top:18px}summary{cursor:pointer;color:var(--mut);min-height:44px;display:flex;align-items:center}
.cm{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.cm span{display:inline-flex;align-items:center;gap:4px;background:var(--soft);padding:4px 4px 4px 10px;padding-inline-start:10px}
.cm button{background:none;border:0;color:var(--mut);font-size:18px;width:32px;height:32px;cursor:pointer}
.cm button:disabled{opacity:.25;cursor:default}
.addc{display:flex;gap:8px}.addc input{flex:1}
.status{font-size:13px;color:var(--mut)}
.toast{position:fixed;inset-inline:16px;bottom:16px;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;transform:translateY(160%);transition:transform .25s}
.toast.show{transform:none}.toast button{background:none;border:0;color:var(--red);font:inherit;font-weight:700;min-height:40px;cursor:pointer;filter:brightness(1.3)}
.copy{margin-top:12px}
.usd{margin-inline-start:auto;padding-bottom:8px;font-size:clamp(26px,5vw,42px);font-weight:700;color:var(--mut);direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}.usd small{font-size:14px;font-weight:500;margin-left:6px}
@media(max-width:600px){table{font-size:13px}th,td{padding:9px 3px}}
@media(max-width:520px){.usd{margin-inline-start:0;flex-basis:100%;padding-bottom:0}}
.groups{border-top:2px solid var(--ink)}
.g{margin:0;border-bottom:1px solid var(--line)}
.g>summary{display:grid;grid-template-columns:minmax(0,1fr) auto 20px;gap:4px 12px;align-items:center;padding:12px 0;color:var(--ink);list-style:none;min-height:56px}
.g>summary::-webkit-details-marker{display:none}
.g>summary::after{content:'‹';font-size:22px;color:var(--mut);transform:rotate(-90deg);transition:transform .2s;text-align:center}
.g[open]>summary::after{transform:rotate(90deg)}
.gn{font-weight:700;font-size:17px}.gn small{font-weight:400;color:var(--mut);font-size:13px;margin-inline-start:6px}
.gv{font-weight:700;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}.gv small{font-weight:400;color:var(--mut);font-size:13px}
.g .tr{grid-column:1/3;height:8px;background:var(--soft)}.g .fl{display:block;height:100%;background:var(--ink)}.g.top .fl{background:var(--red)}
.g .list{border-top:0;background:var(--soft);padding:0 12px;margin-bottom:12px}.g .list li:last-child{border-bottom:0}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:520px){.list li{grid-template-columns:2.6em minmax(0,1fr) auto}.day{font-size:22px}.nav strong{min-width:7em;font-size:16px}th,td{padding:10px 4px;font-size:14px}}
</style></head><body>
<template id="shell">
<section class="band"><div class="wrap">
 <div class="top"><h1>مصاريفي الشهرية <span class="status" id="status"></span></h1>
  <div class="nav"><button id="prev" aria-label="الشهر السابق">›</button><strong id="mname"></strong><button id="next" aria-label="الشهر التالي">‹</button></div></div>
 <div class="total"><div class="big" id="total">0.00</div><div class="cur">دينار</div><div class="usd"><span id="usd">0.00</span> $<small>دولار</small></div></div>
 <div class="meta" id="meta"></div>
</div></section>
<section class="band" style="padding-top:0"><div class="wrap grid">
 <div>
  <h2 id="ftitle">أضف مصروف</h2>
  <form id="f" autocomplete="off">
   <label for="a">المبلغ بالدينار</label><input id="a" class="amt" type="number" inputmode="decimal" step="0.001" min="0" placeholder="0.00" required="">
   <label>الفئة</label><div class="chips" id="chips"></div>
   <div class="row2"><div><label for="d">التاريخ</label><input id="d" type="date" required=""></div>
   <div><label for="n">ملاحظة (اختياري)</label><input id="n" type="text" maxlength="80" placeholder="مثلاً: فاتورة شهر 10"></div></div>
   <button class="go" id="go" type="submit">أضف</button>
   <button class="ghost cancel" id="cancel" type="button" hidden="">إلغاء التعديل</button>
  </form>
  <details><summary>إدارة الفئات</summary>
   <div class="cm" id="cm"></div>
   <div class="addc"><input id="nc" placeholder="فئة جديدة، مثلاً: مواصلات" maxlength="24"><button class="ghost" id="addc" type="button">إضافة</button></div>
  </details>
  <details><summary>ملف Excel والاستيراد</summary>
   <div class="addc" style="flex-wrap:wrap"><button class="ghost" id="xl" type="button">⬇️ تحميل ملف Excel</button><button class="ghost" id="imp" type="button">📥 استيراد ملف بيانات</button><input type="file" id="impf" accept=".json,application/json" hidden></div>
   <div id="impm" style="font-size:14px;margin-top:6px"></div>
  </details>
 </div>
 <div>
  <h2>مصاريف الشهر حسب الفئة</h2><div class="groups" id="list"></div><div id="copybox"></div>
 </div>
</div></section>
<section class="band" style="background:var(--soft)"><div class="wrap">
 <h2>سجل الأشهر</h2>
 <table><thead><tr><th>الشهر</th><th class="n">المجموع (د.أ)</th><th class="n">بالدولار ($)</th><th class="n">عدد</th><th class="n">الفرق (د.أ)</th><th class="n">الفرق ($)</th></tr></thead><tbody id="hist"></tbody></table>
 <div class="sum" id="sum"></div>
</div></section>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="undo" type="button">تراجع</button></div>
</template>
<div id="root"></div>
<script type="application/json" id="state">null</script>
<script id="app-js">{
const STYLE=document.getElementById('st').textContent,SHELL=document.getElementById('shell').innerHTML,APP=document.getElementById('app-js').textContent;
const DEF=["إيجار","كهرباء","ماء","إنترنت منزلي","إنترنت شخصي","ملابس","مطاعم","سوبر ماركت","أخرى"];
let S=null;try{S=JSON.parse(document.getElementById('state').textContent)}catch(e){}
if(!S||!Array.isArray(S.entries))S={cats:DEF.slice(),entries:[]};
document.getElementById('root').innerHTML=SHELL;
const $=id=>document.getElementById(id);
const AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const pad=n=>String(n).padStart(2,'0');
const now=new Date(),today=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate()),thisM=today.slice(0,7);
let cur=thisM;const hm=location.hash.match(/^#m-(\d{4}-\d{2})$/);if(hm)cur=hm[1];
const r3=x=>Math.round(x*1000)/1000;
const fmt=n=>r3(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:3});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mName=k=>AR[+k.slice(5)-1]+' '+k.slice(0,4);
const shift=(k,d)=>{let y=+k.slice(0,4),m=+k.slice(5)+d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+pad(m)};
const inM=k=>S.entries.filter(e=>e.d.slice(0,7)===k);
const sum=a=>r3(a.reduce((t,e)=>t+e.a,0));
const usd=j=>(j/0.708).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const FIXED=['إيجار','إنترنت منزلي','إنترنت شخصي'];
let selCat=S.cats[0],editId=null,lastDel=null,lastSub=0;
let OPEN=new Set();try{OPEN=new Set(JSON.parse(sessionStorage.getItem('masarifi-open')||'[]'))}catch(e){}

function render(){
 const es=inM(cur),tot=sum(es),pt=sum(inM(shift(cur,-1))),diff=r3(tot-pt);
 $('mname').textContent=mName(cur);$('total').textContent=fmt(tot);$('usd').textContent=(tot/0.708).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 $('next').disabled=false;
 $('meta').innerHTML='<span>عدد المصاريف <b>'+es.length+'</b></span>'+(pt?'<span>مقارنة بالشهر السابق <b class="'+(diff>0?'up':'down')+'">'+(diff>0?'+':'')+fmt(diff)+'</b> د.أ · <b class="'+(diff>0?'up':'down')+'">'+(diff>0?'+':'')+usd(diff)+'</b> $</span>':'')+(cur===thisM?'<span>الشهر الحالي</span>':'');
 // chips
 if(!S.cats.includes(selCat))selCat=S.cats[0];
 $('chips').innerHTML=S.cats.map(c=>'<button type="button" aria-pressed="'+(c===selCat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('');
 // grouped by category: one row per category, opens to show the details
 const by={};es.forEach(e=>(by[e.c]=by[e.c]||[]).push(e));
 const gr=Object.entries(by).map(([c,a])=>[c,a.sort((x,y)=>y.d.localeCompare(x.d)||y.id-x.id),sum(a)]).sort((x,y)=>y[2]-x[2]),gmx=gr.length?gr[0][2]:1;
 const item=e=>'<li><div class="day">'+(+e.d.slice(8))+'<small>'+AR[+e.d.slice(5,7)-1]+'</small></div><div class="what"><b>'+(e.n?esc(e.n):'بدون ملاحظة')+'</b></div><div><div class="amtc">'+fmt(e.a)+'</div><div class="acts"><button data-e="'+e.id+'">تعديل</button><button data-x="'+e.id+'">حذف</button></div></div></li>';
 $('list').innerHTML=gr.length?gr.map(([c,a,v],i)=>'<details class="g'+(i===0?' top':'')+'" data-g="'+esc(c)+'"'+(OPEN.has(c)?' open':'')+'><summary><span class="gn">'+esc(c)+(a.length>1?'<small>'+a.length+' مرات</small>':'')+'</span><span class="gv">'+fmt(v)+' <small>'+Math.round(v/tot*100)+'%</small></span><span></span><span class="tr"><span class="fl" style="width:'+(v/gmx*100).toFixed(1)+'%"></span></span></summary><ul class="list">'+a.map(item).join('')+'</ul></details>').join(''):'<div class="empty">ابدأ بإضافة أول مصروف لشهر '+mName(cur)+' — المجموع يبدأ من صفر كل شهر.</div>';
 // copy fixed from previous month
 const prevFixed=inM(shift(cur,-1)).filter(e=>FIXED.includes(e.c));
 $('copybox').innerHTML=(!es.length&&prevFixed.length)?'<button class="ghost copy" id="copy" type="button">انسخ الإيجار والإنترنت من الشهر السابق ('+fmt(sum(prevFixed))+' د.أ)</button>':'';
 // history
 const ms=[...new Set(S.entries.map(e=>e.d.slice(0,7)).concat([thisM,cur]))].sort().reverse();
 $('hist').innerHTML=ms.map(m=>{const t=sum(inM(m)),p=sum(inM(shift(m,-1))),d=r3(t-p);return '<tr data-m="'+m+'" class="'+(m===cur?'on':'')+'"><td>'+mName(m)+'</td><td class="n">'+fmt(t)+'</td><td class="n usdc">'+usd(t)+'</td><td class="n">'+inM(m).length+'</td><td class="n '+(p?(d>0?'up':'down'):'')+'">'+(p?(d>0?'+':'')+fmt(d):'—')+'</td><td class="n '+(p?(d>0?'up':'down'):'')+'">'+(p?(d>0?'+':'')+usd(d):'—')+'</td></tr>'}).join('');
 const withData=ms.filter(m=>inM(m).length),all=sum(S.entries);
 $('sum').innerHTML='<span>إجمالي كل الأشهر <b>'+fmt(all)+'</b> د.أ · <b>'+usd(all)+'</b> $</span>'+(withData.length?'<span>متوسط الشهر <b>'+fmt(all/withData.length)+'</b> د.أ · <b>'+usd(all/withData.length)+'</b> $</span>':'');
 // form date default inside month
 if(!editId){const dv=$('d').value;if(!dv||dv.slice(0,7)!==cur)$('d').value=cur===thisM?today:cur+'-01'}
 // category manager
 $('cm').innerHTML=S.cats.map(c=>{const used=S.entries.some(e=>e.c===c);return '<span>'+esc(c)+'<button type="button" data-rc="'+esc(c)+'" '+(used?'disabled title="مستخدمة في مصاريف"':'')+' aria-label="حذف الفئة">×</button></span>'}).join('');
}
function go(m){cur=m;try{history.replaceState(null,'','#m-'+m)}catch(e){location.hash='m-'+m}render()}
function resetForm(){editId=null;$('f').reset();$('ftitle').textContent='أضف مصروف';$('go').textContent='أضف';$('cancel').hidden=true;render()}
function toast(msg,undo){$('tmsg').textContent=msg;$('undo').hidden=!undo;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),5000)}

// persistence — محفوظ على الجهاز ويتزامن مع Google
const DB=Hesabati.db;let synced=new Map(),syncedCats=null;
const status=t=>{const e=$('status');if(e)e.textContent=t?'· '+t:''};
function save(){
 const now=new Map(S.entries.map(e=>[String(e.id),JSON.stringify(e)])),ops=[];
 for(const[id,j]of now)if(synced.get(id)!==j)ops.push({col:'entries',id,data:JSON.parse(j)});
 for(const id of synced.keys())if(!now.has(id))ops.push({col:'entries',id,del:1});
 const cj=JSON.stringify(S.cats);if(syncedCats!==null&&cj!==syncedCats||syncedCats===null&&cj!==JSON.stringify(DEF))ops.push({col:'config',id:'cats',data:{cats:S.cats}});
 synced=now;syncedCats=cj;if(ops.length)DB.bulk(ops)}
DB.collection('entries').onSnapshot(sn=>{const l=sn.docs.map(d=>d.data()).filter(e=>e&&e.d);S.entries=l;synced=new Map(l.map(e=>[String(e.id),JSON.stringify(e)]));if(editId&&!l.some(e=>e.id===editId))resetForm();else render()});
DB.doc('config/cats').onSnapshot(sn=>{if(sn.exists&&Array.isArray(sn.data().cats)){S.cats=sn.data().cats;syncedCats=JSON.stringify(S.cats);render()}});
async function buildXl(){
 const es=[...S.entries].sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id);
 const ms=[...new Set(es.map(e=>e.d.slice(0,7)))].sort();
 const cats=[...new Set(S.cats.concat(es.map(e=>e.c)))];
 const rows1=[['التاريخ','الفئة','المبلغ (د.أ)','بالدولار ($)','ملاحظة']].concat(es.map(e=>[e.d,e.c,e.a,r3(e.a/0.708),e.n||'']));
 const rows2=[['الفئة'].concat(ms.map(mName))].concat(cats.map(c=>[c].concat(ms.map(m=>sum(es.filter(e=>e.c===c&&e.d.slice(0,7)===m))||'')))).concat([['المجموع (د.أ)'].concat(ms.map(m=>sum(es.filter(e=>e.d.slice(0,7)===m)))),['بالدولار ($)'].concat(ms.map(m=>r3(sum(es.filter(e=>e.d.slice(0,7)===m))/0.708)))]);
 return{blob:await HZip.makeXlsx([{name:'المصاريف',rows:rows1,widths:[13,18,14,14,36]},{name:'ملخص الأشهر',rows:rows2,widths:[20].concat(ms.map(()=>16))}]),name:'مصاريفي الشهرية '+today+'.xlsx'}}
Hesabati.dailyExcel(buildXl);
$('xl').onclick=async()=>{const{blob,name}=await buildXl();Hesabati.downloads.save({filename:name,data:blob})};
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(x){$('impm').textContent='الملف غير صحيح';return}
 if(!d||!Array.isArray(d.entries)){$('impm').textContent='هذا مو ملف بيانات المصاريف';return}
 $('impm').innerHTML='الملف فيه <b>'+d.entries.length+'</b> مصروف. الاستيراد يستبدل البيانات الحالية ('+S.entries.length+'). <button class="ghost" id="impok" type="button">استورد</button>';
 $('impok').onclick=()=>{S.entries=d.entries.filter(x=>x&&x.d&&x.id!=null);if(Array.isArray(d.cats)&&d.cats.length)S.cats=d.cats;save();render();$('impm').textContent='تم الاستيراد ✓'}};

// events
$('prev').onclick=()=>go(shift(cur,-1));$('next').onclick=()=>go(shift(cur,1));
$('chips').onclick=e=>{const b=e.target.closest('[data-c]');if(b){selCat=b.dataset.c;render()}};
$('list').addEventListener('toggle',e=>{const g=e.target.closest&&e.target.closest('[data-g]');if(!g)return;g.open?OPEN.add(g.dataset.g):OPEN.delete(g.dataset.g);try{sessionStorage.setItem('masarifi-open',JSON.stringify([...OPEN]))}catch(x){}},true);
$('f').addEventListener('submit',e=>{e.preventDefault();if(Date.now()-lastSub<900)return;lastSub=Date.now();const a=r3(parseFloat($('a').value));if(!(a>0)){$('a').focus();return}
 const rec={a,c:selCat,d:$('d').value||today,n:$('n').value.trim()};
 if(editId){Object.assign(S.entries.find(x=>x.id===editId),rec);toast('تم التعديل')}else{rec.id=Date.now();S.entries.push(rec);toast('أُضيف '+fmt(a)+' د.أ — '+rec.c)}
 const m=rec.d.slice(0,7);save();editId=null;$('a').value='';$('n').value='';$('ftitle').textContent='أضف مصروف';$('go').textContent='أضف';$('cancel').hidden=true;if(m!==cur)go(m);else render();$('a').focus()});
$('cancel').onclick=resetForm;
$('list').onclick=e=>{const ed=e.target.closest('[data-e]'),dl=e.target.closest('[data-x]');
 if(ed){const x=S.entries.find(y=>y.id===+ed.dataset.e);editId=x.id;$('a').value=x.a;$('d').value=x.d;$('n').value=x.n||'';selCat=x.c;$('ftitle').textContent='تعديل مصروف';$('go').textContent='احفظ التعديل';$('cancel').hidden=false;render();$('f').scrollIntoView({behavior:'smooth',block:'start'});$('a').focus()}
 if(dl){const i=S.entries.findIndex(y=>y.id===+dl.dataset.x);lastDel=S.entries.splice(i,1)[0];if(editId===lastDel.id)resetForm();save();render();toast('حُذف '+fmt(lastDel.a)+' د.أ',true)}};
$('undo').onclick=()=>{if(lastDel){S.entries.push(lastDel);lastDel=null;save();render();$('toast').classList.remove('show')}};
$('copybox').onclick=e=>{if(e.target.id!=='copy')return;let id=Date.now();inM(shift(cur,-1)).filter(x=>FIXED.includes(x.c)).forEach(x=>S.entries.push({id:id++,a:x.a,c:x.c,d:cur+'-'+x.d.slice(8),n:x.n}));save();render();toast('تم النسخ من الشهر السابق')};
$('hist').onclick=e=>{const r=e.target.closest('[data-m]');if(r){go(r.dataset.m);window.scrollTo({top:0,behavior:'smooth'})}};
$('addc').onclick=()=>{const v=$('nc').value.trim();if(v&&!S.cats.includes(v)){S.cats.splice(S.cats.length-(S.cats.includes('أخرى')?1:0),0,v);selCat=v;$('nc').value='';save();render()}};
$('nc').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('addc').click()}});
$('cm').onclick=e=>{const b=e.target.closest('[data-rc]');if(b&&!b.disabled){S.cats=S.cats.filter(c=>c!==b.dataset.rc);save();render()}};
render();
}</script></body></html>
